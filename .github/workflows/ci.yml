name: CI

on:
  pull_request:
  push:
    # The development trunk. 'main' here still holds the legacy SaaS tree; the default branch
    # was switched to the dev branch on 2026-08-12 so schedules and pushes actually run. At
    # launch, the public repo's main becomes the trunk and this list goes back to [main].
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # Pinned by version AND by checksum. A supply-chain compromise of a release asset is exactly
  # the class of problem a secret scanner is supposed to protect against, so the scanner itself
  # is not fetched on trust. Update both together; the checksums file for a release is at
  # https://github.com/gitleaks/gitleaks/releases/download/vX.Y.Z/gitleaks_X.Y.Z_checksums.txt
  GITLEAKS_VERSION: '8.30.1'
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  # WHICH JOBS A PULL REQUEST RUNS (owner ruling). A pull request that changes only the UI, the
  # docs or the agent notes runs typecheck, the unit tests and the secret scan — and nothing
  # else. Release tarballs, the BYO lifecycle and the structural lint guard boundaries that
  # such a change cannot cross, so they wait for the push run on main, which is never
  # filtered. Anything outside those paths — core, a provider, a pack, a script, this file —
  # runs everything. Per job rather than a workflow-level `paths-ignore`, because that is
  # all-or-nothing and the unit tests are exactly what a UI change needs.
  #
  # The file list comes from the pull request itself rather than a `git diff` against the
  # base, so it is right for a merge-commit checkout, a rebased branch and a shallow clone
  # alike. Everything but a pull request (the push to main) is "beyond UI" by definition.
  scope:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      beyond-ui: ${{ steps.scope.outputs.beyond-ui }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "beyond-ui=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
          # UI-only: every changed file is under one of these, or is Markdown.
          if printf '%s\n' "$files" | grep -qvE '^(packages/web/|docs/|\.claude/|\.agents/skills/|\.pass-along/|LICENSE$)|\.md$'; then
            echo "beyond-ui=true" >> "$GITHUB_OUTPUT"
            echo "runs everything: the pull request reaches beyond the UI and docs"
          else
            echo "beyond-ui=false" >> "$GITHUB_OUTPUT"
            echo "UI/docs only: typecheck, unit tests and the secret scan run; the rest waits for main"
          fi

  # The three structural checks, in one job because they are three seconds each and a
  # contributor wants one red X, not three. Each guards a boundary that nothing else can see:
  #
  #   check-core-deps    core imports @rockysurf/provider-sdk and nothing else in the workspace
  #   check-iam-policy   deploy/aws/iam-role.yaml and docs/providers/aws.md have not drifted
  #   check-npx-closure  the AWS SDK has not arrived in core's production dependency closure
  lint:
    name: Lint (structure)
    needs: scope
    if: needs.scope.outputs.beyond-ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # The closure check reads the RESOLVED dependency tree (`pnpm list --prod`), not the
      # manifests, so it needs an install. It does not need a build.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

      # The orphan audit's credential seam (rockysurf-ufwn). It belongs in this job because it is
      # three seconds and no build: it resolves fixtures, reads the nightly workflow's step order,
      # and spawns the lifecycle twice to watch it refuse. The property it defends — the audit
      # reads with STRONGER credentials than the run under test — otherwise has no check until a
      # real nightly, and its failure mode is a green run that saw nothing.
      - name: Audit-credential seam self-test
        run: node scripts/e2e/audit-credentials-selftest.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # DO NOT REMOVE (rockysurf-7mdh). Workspace packages resolve each other through dist/,
      # which is gitignored — without a build, typecheck fails on TS2307 for every internal
      # import. This is the fresh-clone property no developer machine ever witnesses, because
      # every developer machine has a dist/ left over from the last build.
      - run: pnpm -r build
      - run: pnpm -r typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same fresh-clone requirement as typecheck, and worse here: without dist/ the suites do
      # not merely fail, they do not LOAD. `Test Files 3 failed (3) / Tests no tests` reads like
      # a package that has no tests yet (rockysurf-7mdh).
      - run: pnpm -r build
      - run: pnpm -r test

  # Secret scanning. The repository is public and its history is being restarted because the old
  # one was saturated with account ids and live identifiers — this job is what keeps that from
  # happening again. The rules are in .gitleaks.toml; read its header before changing anything.
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the scan walks history, not just the diff
      # No pnpm install anywhere in this job: the self-test takes no dependencies, which is why
      # it can run before anything else has been resolved or built. setup-node@v5 defaults to
      # auto-detecting the root package.json's `packageManager` field and priming a pnpm cache,
      # which needs the pnpm executable this job never installs (rockysurf-382) - opt out.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # A pinned binary rather than gitleaks/gitleaks-action: the action requires a
      # GITLEAKS_LICENSE for repositories owned by an organization, which this one is, and a
      # scan that silently stops running when a licence lapses is worse than no scan. gitleaks
      # itself is MIT and is one static binary.
      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          # Into the runner's own bin directory rather than /usr/local/bin: no sudo, and no
          # assumption about who owns a system path on whichever image this lands on.
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version

      # BEFORE the scan, deliberately. A scan whose rules have quietly stopped matching passes,
      # and a passing scan is indistinguishable from a clean tree. This proves each rule still
      # fires on a fixture of the values it was written for, that none of them fires on the
      # near-misses that exist in the live tree, and that the allowlist has not outlived the
      # files it excuses.
      - name: Self-test the rules
        run: node scripts/gitleaks-selftest.mjs

      # `git`, not `dir`: it covers every file's content as of every commit, which is both the
      # working tree and the history in one pass, and it takes under a second on this repository.
      - name: Scan
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact --report-format sarif --report-path gitleaks.sarif

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

  # What a published install UNPACKS, as opposed to what it downloads (which is the closure
  # check in the lint job). Packs every workspace package exactly as `pnpm publish -r` would,
  # then installs the packed CLI into an empty directory from those tarballs alone — no registry
  # — and runs its binary. ~30s. Deliberately NOT part of `pnpm run lint`, which must stay fast.
  #
  # This is the check that would have caught rockysurf-3hz9: four of the CLI's five workspace
  # dependencies were `private: true`, so the published tarball named versions that did not
  # exist. Nothing that inspects manifests can see that; only an install can.
  tarballs:
    name: Release tarballs
    needs: scope
    if: needs.scope.outputs.beyond-ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: node scripts/verify-tarballs.mjs

  # The BYO provider against a REAL OpenSSH server, in a container (rockysurf-ftl9.10). 75
  # checks, well under two minutes, and — uniquely among this project's real-infrastructure
  # runs — no cloud credentials, no secrets and no spend, which is what makes it the one that
  # can gate a pull request instead of waiting for the nightly.
  #
  # It also exercises the push bootstrap's NOHUP launcher fallback, because a container has no
  # /run/systemd/system. The nightly's cloud runs never reach that path: they both boot systemd.
  # The two are complementary, not redundant.
  #
  # IT NEEDS NO PARTICULAR PORT FREE (rockysurf-ftl9.15). It used to need 127.0.0.1:22, because
  # core dialled 22 unconditionally in push mode — rockysurf-ftl9.12 fixed that, and the script
  # now publishes the container's sshd on a random non-22 port, with --port to pin one. It still
  # preflights, but for the port it picked. The caveat this paragraph used to carry about
  # self-hosted runners went with it: not needing 22 makes the job more portable, not less.
  byo-host:
    name: BYO lifecycle (real sshd)
    needs: scope
    if: needs.scope.outputs.beyond-ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # It drives the built binary, not the sources: the shipped article is the subject.
      - run: pnpm -r build
      - run: node scripts/e2e/byo-host.mjs

  # THE BROWSER LAYER (issue #310). Two UI regressions shipped in one day — a settings section
  # that rendered no controls at all, and a save-path interlock that disabled the button an
  # operator reaches for — while Typecheck, Test and the real-HTTP API checks were green both
  # times. None of them ever loaded the built SPA into a browser engine and clicked anything.
  # This does: it boots the shipped binary against a temp config file on an OS-assigned port and
  # drives the real pages, login form included. See `packages/web/e2e/control-plane.ts`.
  #
  # ALWAYS-RUN, AND DELIBERATELY NOT PATH-FILTERED — no `needs: scope`, no `if:`. The owner
  # intends to make this a required check once it has baked for a few days, and a required check
  # that is workflow- or job-level path-filtered never reports at all on the pull requests it
  # skips, which deadlocks the merge forever
  # (docs/memories/2026-08-31-branch-protection-and-pr-workflow.md). Adding a filter here later
  # would look like a harmless optimisation and would break every merge.
  #
  # NOT part of `pnpm run check`: it needs a browser binary that `pnpm install` does not fetch,
  # and a serial gate that fails on a clean checkout for an unexplained reason gets worked
  # around rather than fixed. `pnpm run test:ui` is the local entry point.
  ui:
    name: UI (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite spawns `packages/rockysurf/dist/bin.js` and the SPA that core serves is a build
      # artifact, so this is the same fresh-clone requirement Typecheck and Test carry — and here
      # it is doubly load-bearing, since an unbuilt SPA serves an index.html referencing assets
      # that do not exist and every page renders blank.
      - run: pnpm -r build
      # Browsers are not in the lockfile: `@playwright/test` is the driver, the engine is a
      # separate download. Chromium only — one engine is enough to catch a control that does not
      # render, and three would triple the job for no coverage this suite is asking for.
      - name: Install Chromium
        working-directory: packages/web
        run: npx playwright install --with-deps chromium
      - run: pnpm run test:ui
      # Screenshots, traces and the HTML report. A browser failure that happens on a runner and
      # nowhere else is close to undebuggable without the trace, and `retain-on-failure` means
      # there is nothing to upload when the job is green.
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: ui-browser-artifacts
          path: |
            packages/web/test-results
            packages/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
