name: Pack smoke

# The NORMATIVE, merge-gating pack check from docs/writing-a-pack.md § "The CI smoke test".
# Its own workflow rather than a job in ci.yml because it is the one gate measured in minutes
# rather than seconds, and because its matrix — every pack, on both architectures — is the part
# most likely to need editing when a pack is added.
#
# WHAT IT PROVES, and why each half is load-bearing:
#
#   TWO ARCHITECTURES. There is no "amd64 only" pack. A hardcoded `x86_64` in a download URL is
#   the single most common pack bug and it is invisible on one architecture.
#
#   TWO RUNS IN ONE CONTAINER, WITH THE RESUME JOURNAL DELETED BETWEEN THEM. The second run is
#   the whole exercise. The on-box agent is contracted to read /var/lib/rockysurf/state.json and
#   skip every step already marked `done` — that is how an interrupted install resumes — so a
#   harness that merely re-invokes the agent gets a green run in seconds in which no script body
#   executed twice. scripts/pack-smoke.mjs deletes the journal first, and asserts the second run
#   contains no resume-skip line, so a regression in that discard fails the check rather than
#   quietly making it meaningless.
#
# The container is deliberately harsher than any real cloud image: stock ubuntu:24.04, no
# convenience packages, empty apt lists, and no sudo.

on:
  pull_request:
    # Only when something that reaches a box could have changed. The matrix is twenty Docker
    # legs, half under QEMU, at up to an hour each — a web-only or docs-only pull request
    # proves nothing by running it. `packages/core/**` is listed whole rather than just
    # `bootstrap/` and `packs/`: the harness imports the whole package, and a narrower list is
    # the kind that rots silently. Pushes to main stay unfiltered so the trunk is always fully
    # proven after a merge. If main ever gets branch protection with this workflow required,
    # remove the filter — a required check that a path filter skips sits at "Expected" forever.
    paths:
      - 'packs/**'
      - 'packages/core/**'
      - 'packages/rockysurf/**'
      - 'scripts/pack-smoke.mjs'
      - 'scripts/docker-smoke.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/pack-smoke.yml'
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # Which packs exist is data, not something to keep in sync by hand: a contributor who adds
  # packs/rust-dev.yaml gets a matrix leg for it without touching this file.
  #
  # WHICH PACKS A PULL REQUEST TESTS (owner ruling). A pull request that changes ONLY pack files
  # tests the packs it changed — plus every pack whose `pack.tools` lists a tool one of those
  # files defines, because ids resolve across files (gas-town lists claude-code, amp and codex
  # from three other packs, so a change to any of those files is a change to gas-town). A pull
  # request that changes anything else this workflow triggers on — the agent, core, the harness,
  # the lockfile, this file — tests every pack, since every pack runs through it. A push to main
  # always tests every pack. A pull request whose pack changes select nothing (a deletion) falls
  # back to every pack rather than an empty matrix.
  discover:
    name: Discover packs
    runs-on: ubuntu-latest
    outputs:
      packs: ${{ steps.list.outputs.packs }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # `find`, not a `ls packs/*.yaml packs/*.yml` glob: with no .yml files present bash
          # hands ls the unmatched pattern, ls exits 2, and `set -o pipefail` turns a correct
          # listing into a failed job.
          all=$(find packs -maxdepth 1 -type f \( -name '*.yaml' -o -name '*.yml' \) -printf '%f\n' \
            | sed 's/\.[^.]*$//' | sort)
          test -n "$all" || { echo '::error::no pack files in packs/'; exit 1; }

          pack_file() { if [ -f "packs/$1.yaml" ]; then echo "packs/$1.yaml"; else echo "packs/$1.yml"; fi; }

          selected="$all"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
            if printf '%s\n' "$files" | grep -qvE '^packs/[^/]+\.ya?ml$'; then
              echo "every pack: the pull request changes more than pack files"
            else
              changed=$(printf '%s\n' "$files" | sed -E 's|^packs/||; s/\.[^.]*$//' | sort -u)
              # Tool ids the changed files define (a deleted file defines nothing any more).
              ids=$(for p in $changed; do f=$(pack_file "$p"); [ -f "$f" ] || continue
                      grep -E '^[[:space:]]*-?[[:space:]]*toolId:' "$f" | sed -E 's/.*toolId:[[:space:]]*//; s/["'"'"']//g'; done | sort -u)
              alt=$(printf '%s\n' "$ids" | grep . | paste -sd'|' - || true)
              selected=$(for p in $all; do
                if printf '%s\n' "$changed" | grep -qx "$p"; then echo "$p"
                elif [ -n "$alt" ] && grep -qE "^[[:space:]]*-[[:space:]]*($alt)[[:space:]]*$" "$(pack_file "$p")"; then echo "$p"
                fi; done | sort -u)
              if [ -n "$selected" ]; then
                echo "pack files only: the changed packs and the packs that list their tools"
              else
                selected="$all"; echo "every pack: the pack changes select nothing (deletion only)"
              fi
            fi
          fi

          packs=$(printf '%s\n' "$selected" | jq -R . | jq -sc .)
          echo "packs=$packs" >> "$GITHUB_OUTPUT"
          echo "matrix: $packs"

  packs:
    name: ${{ matrix.pack }} (${{ matrix.arch }})
    needs: discover
    runs-on: ${{ matrix.runner }}
    # Generous on purpose. The heaviest packs install a compiler, a browser stack and a desktop
    # environment, twice; locally the longest is a few minutes, and a runner with fewer cores and
    # a colder apt mirror is the case this number has to survive. A timeout that fires
    # spuriously teaches people to re-run the job without reading it.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pack: ${{ fromJSON(needs.discover.outputs.packs) }}
        arch: [amd64, arm64]
        # Native runners on both sides. GitHub's arm64 Linux runners are free for public
        # repositories, and native is worth arranging: the same work under QEMU user-mode
        # emulation runs roughly an order of magnitude slower, which for a matrix that installs
        # a compiler and a browser stack is the difference between minutes and hitting the
        # timeout. If the `ubuntu-24.04-arm` label is ever unavailable, set the arm64 runner to
        # `ubuntu-24.04` and add `qemu: true` — the harness already passes
        # `docker run --platform`, so QEMU is the only missing piece.
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The harness resolves the pack with core's OWN resolver and runs core's OWN agent.sh, both
      # out of built packages, so the plan under test is the plan a release renders rather than a
      # re-implementation of it that could agree with the pack while disagreeing with production.
      - name: Build the CLI (the harness lives in it now)
        # `rockysurf`, not `@rockysurf/core`: the harness moved into
        # `packages/rockysurf/src/cli/pack-smoke.ts` (rockysurf-arym.2) so that
        # `amroja-biz/rockysurf-shop` can run the identical check as `rockysurf pack check`.
        # `scripts/pack-smoke.mjs` imports the BUILT CLI, and building core alone leaves it
        # absent — every leg of this matrix would exit 2 with "rockysurf is not built".
        #
        # `...` builds workspace DEPENDENCIES first (provider-sdk resolves through its dist/,
        # which a fresh runner has never built). Filtering a package alone compiled against a
        # missing one and failed every leg of this matrix on the first real run — the
        # rockysurf-7mdh fresh-clone lesson, found in one more hiding place (PR #6).
        run: pnpm --filter 'rockysurf...' build

      # Only needed when the runner's architecture differs from the target's. Left in place, and
      # conditional, so switching the arm64 leg back to an amd64 runner is a one-line change.
      - name: Enable QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/${{ matrix.arch }}

      - name: Two runs, one container, journal discarded between them
        run: node scripts/pack-smoke.mjs --pack ${{ matrix.pack }} --arch ${{ matrix.arch }}
