# opencode — the open-source, provider-agnostic coding agent, on the shared base toolchain.
#
# Imported from the legacy SaaS admin tables (rockysurf-gogh). The legacy row installed the
# agent with `curl -fsSL https://opencode.ai/install | bash` under `runAs: rocky`; that is a
# per-user install into $HOME with an unguarded PATH append, and it fails this repo's
# byte-identical-.bashrc check on the second run. The npm route below is what amp and codex
# already use, so all three agents now install the same way.
#
# The base tool ids below are DEFINED in packs/base.yaml and referenced here.
# Only `opencode` and `herdr-opencode-integration` are defined in this file.
version: 1

pack:
  packId: open-code
  name: opencode
  tools:
    - build-essential
    - curl
    - gh
    - git
    - tmux
    - tmux-mouse
    - unzip
    - python3-pip
    - python3-venv
    - pipx
    - nodejs
    - playwright-deps
    - playwright
    - beads
    - herdr
    - opencode
    - herdr-opencode-integration
  displayOrder: 6
  enabled: true
  imageUrl: /images/surge-packs/open-code.png
  requiresRepos: true
  requiresRdp: false
  guide: |
    Everything below runs on the box, as `rocky`, after you have SSH'd in.

    opencode
      opencode auth login     pick a provider, then paste its API key
      opencode auth list      shows which providers are already configured
      opencode                starts the terminal UI in the current directory

      opencode is provider-agnostic and ships with NO credentials — it talks to
      Anthropic, OpenAI, Google or a local model, whichever you give it a key for.
      Keys you add are written to ~/.local/share/opencode/auth.json on this box.
      opencode models         lists what the configured providers offer

    GitHub
      gh auth login           then: gh auth setup-git

      If the operator set `github.pat` in rockysurf.config.yaml, that token is in your
      shell as $GITHUB_TOKEN — the same one that cloned your repositories — so `gh` works
      as it is; run `gh auth setup-git` once and your own pushes do too. With no token
      configured, `gh auth login` is the way in.

    Also installed
      bd            Beads task tracker — run `bd init` in a repository to start
      tmux          run agents in here; a dropped SSH connection then costs you nothing
      Playwright with Chromium, for browser work

    Herdr
      herdr                   opens the workspace; start agents inside it and a dropped SSH
                              connection costs you nothing — `herdr` again reattaches
      herdr --help            the rest of what it does

      On your own machine, one line attaches this box to your local herdr, so its agents
      show up beside the ones running there:

        herdr machine add rocky@<ip>

      herdr has no `-i` flag: it connects with whatever plain `ssh rocky@<ip>` would use.
      If that bare command does not get you in on its own, herdr will not either — give ssh
      the key first, either with a block in ~/.ssh/config

        Match user rocky
          IdentityFile ~/.ssh/<your-key>

      or by loading it into your agent with `ssh-add ~/.ssh/<your-key>`.

      Installed at ~/.local/bin/herdr, pinned to 0.9.0.
      The opencode integration is already installed — `herdr integration status` says
      `opencode: current` — so opencode reports working, blocked or idle from its very
      first run.

tools:
  - toolId: opencode
    name: opencode
    description: Open-source terminal coding agent that runs on Claude, OpenAI, Google or a local model
    category: agent
    url: https://github.com/anomalyco/opencode
    installOrder: 40
    # A global npm install writes into /usr/lib/node_modules, which is root's. The legacy
    # definition claimed `rocky` and piped a curl installer into bash — honest privilege
    # instead, matching amp and codex.
    runAs: root
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      # UNPINNED (deliberate): an agent CLI pinned to a stale version is worse for the user
      # than one that tracks its own releases. npm install -g is convergent.
      #
      # No $ARCH branch is needed: the package ships per-platform binaries as optional
      # dependencies (opencode-linux-x64 / opencode-linux-arm64) and npm picks the right
      # one. The version check at the end is what proves it picked an executable build.
      npm install -g --no-fund --no-audit opencode-ai
      opencode --version >/dev/null

  # opencode's Herdr integration: the plugin scripts herdr's TUI-session hook needs plus a
  # tui.jsonc it can merge into, under ~/.config/opencode. `herdr integration install opencode`
  # writes plugins/herdr-agent-state.js and plugins/herdr-tui-session.js into that directory and
  # ensures tui.jsonc exists there, and it refuses to run until the directory itself exists —
  # opencode only creates ~/.config/opencode on its first interactive run, which never happens
  # during a bootstrap — so the directory is created here first. Verified 2026-09-11 that
  # `herdr integration install` is idempotent (a second run leaves the plugin files and
  # tui.jsonc byte-identical). Band 50: needs `herdr` (30) on disk and is meaningful only once
  # `opencode` (40) is installed.
  - toolId: herdr-opencode-integration
    name: Herdr opencode integration
    description: Installs herdr's state hook into ~/.config/opencode so opencode reports its state to herdr
    category: base
    url: https://herdr.dev
    installOrder: 50
    runAs: rocky
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      export PATH="$HOME/.local/bin:$PATH"
      mkdir -p "$HOME/.config/opencode"
      herdr integration install opencode >/dev/null
      herdr integration status | grep -qE '^opencode: current'
