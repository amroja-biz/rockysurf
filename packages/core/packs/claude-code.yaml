# Claude Code — the flagship pack. It installs Claude Code; the other agents ship as their own
# packs (`amp-agents`, `codex-cli`, `open-code`, `cursor-cli`, `grok-build` and the rest).
#
# It DEFINES TWO TOOLS — `claude-code` and `herdr-claude-integration`, the herdr hook that only
# makes sense where Claude Code is — and borrows the rest. The base toolchain its `pack.tools`
# lists — build-essential through herdr — is defined in `packs/base.yaml` and referenced here by
# id, the same way every other pack does it (see docs/surge-pack-contract.md: a tool is defined
# in exactly one file and referenced from anywhere). It used to be defined HERE, which meant one
# typo in this file emptied the whole pack picker; issue #499 moved it out, and `base.yaml`'s
# header has the rest of that story.
version: 1

pack:
  packId: claude-code
  name: Claude Code
  tools:
    - build-essential
    - curl
    - gh
    - git
    - tmux
    - tmux-mouse
    - unzip
    - python3-pip
    - python3-venv
    - pipx
    - nodejs
    - playwright-deps
    - playwright
    - beads
    - herdr
    - claude-code
    - herdr-claude-integration
  displayOrder: 1
  enabled: true
  imageUrl: /images/surge-packs/claude-code.png
  requiresRepos: true
  requiresRdp: false
  guide: |
    Everything below runs on the box, as `rocky`, after you have SSH'd in.

    Claude Code
      claude                  first run walks you through signing in
      claude setup-token      mints a long-lived token instead, for a subscription plan
      API billing instead of a subscription? Put your key in the shell and keep it:
        echo 'export ANTHROPIC_API_KEY=...' >> ~/.bashrc && . ~/.bashrc
      Next time, put ANTHROPIC_API_KEY on a `secret:` line of the create form's Environment
      field and it is already in your shell when you land here.

    GitHub
      gh auth login           then: gh auth setup-git

      If the operator set `github.pat` in rockysurf.config.yaml, that token is in your
      shell as $GITHUB_TOKEN — the same one that cloned your repositories — so `gh` works
      as it is; run `gh auth setup-git` once and your own pushes do too. With no token
      configured, `gh auth login` is the way in.

    Also installed
      bd            Beads task tracker — run `bd init` in a repository to start
      tmux          run agents in here; a dropped SSH connection then costs you nothing
      Playwright with Chromium, for browser work

    Herdr
      herdr                   opens the workspace; start agents inside it and a dropped SSH
                              connection costs you nothing — `herdr` again reattaches
      herdr --help            the rest of what it does

      On your own machine, one line attaches this box to your local herdr, so its agents
      show up beside the ones running there:

        herdr machine add rocky@<ip>

      herdr has no `-i` flag: it connects with whatever plain `ssh rocky@<ip>` would use.
      If that bare command does not get you in on its own, herdr will not either — give ssh
      the key first, either with a block in ~/.ssh/config

        Match user rocky
          IdentityFile ~/.ssh/<your-key>

      or by loading it into your agent with `ssh-add ~/.ssh/<your-key>`.

      Installed at ~/.local/bin/herdr, pinned to 0.9.0.
      The Claude Code integration is already installed — `herdr integration status`
      says `claude: current` — so Claude reports working, blocked or idle from its very
      first run.

tools:
  # ---------------------------------------------------------------- band 40: agents
  - toolId: claude-code
    name: Claude Code
    description: Anthropic's AI coding assistant CLI
    category: agent
    url: https://claude.com/claude-code
    installOrder: 40
    # A global npm install writes into node's own prefix, which apt's nodejs package puts
    # under root's ownership — same reason `opencode` (packs/open-code.yaml) runs as root
    # instead of the vendor installer's old per-user ~/.local/bin path under `rocky`.
    runAs: root
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      # PINNED TO THE `stable` DIST-TAG, not `latest` and not a version number — read this
      # before "simplifying" it to a bare `npm install -g @anthropic-ai/claude-code`.
      #
      # docs/surge-pack-contract.md's registry-channel rule says a bare package name resolves
      # "the registry's stable channel", meaning npm's `latest` dist-tag. That sentence is
      # true for every other agent pack in this repository, but not for this package: checked
      # 2026-08-21 via `npm view @anthropic-ai/claude-code dist-tags`, this package's tags
      # were latest=2.1.239, stable=2.1.231, next=2.1.239 — `latest` runs AHEAD of a tag
      # literally named `stable`, and `next` equals `latest` rather than being a prerelease
      # channel. A bare install here would not give this pack "latest stable", it would give
      # it whatever Anthropic is currently rolling out.
      #
      # `@stable` is still a dist-tag, not a version pin — it moves forward whenever
      # Anthropic re-points it, same as a bare install tracking `latest` would — so this
      # stays inside the doc's "quota-free registry channel: install latest, unversioned"
      # policy (rule 1); it just names the moving target explicitly instead of taking npm's
      # default, because for this one package npm's default is not that target. See
      # docs/surge-pack-contract.md § Which version to install.
      npm install -g --no-fund --no-audit @anthropic-ai/claude-code@stable
      claude --version >/dev/null

  # ---------------------------------------------------------------- band 50: needs an agent
  # Herdr's Claude Code integration: a SessionStart hook in ~/.claude/settings.json plus the
  # hook script it calls, so Claude reports its state to herdr instead of herdr guessing from
  # the process. `herdr integration install claude` refuses to run until ~/.claude exists, and
  # Claude Code only creates that directory on its first interactive run — which never happens
  # during a bootstrap — so the directory is created here first. Verified 2026-09-11 that the
  # install is idempotent (a second run leaves both files byte-identical) and that it MERGES
  # into an existing settings.json rather than replacing it. Band 50: needs `herdr` (30) on
  # disk and is meaningful only once `claude-code` (40) is installed.
  #
  # Defined here rather than in base.yaml because it is Claude Code's, not the base toolchain's:
  # `packs/gas-town.yaml` carries Claude Code too and references this id.
  - toolId: herdr-claude-integration
    name: Herdr Claude Code integration
    description: Installs herdr's SessionStart hook into ~/.claude so Claude Code reports its state to herdr
    category: base
    url: https://herdr.dev
    installOrder: 50
    runAs: rocky
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      export PATH="$HOME/.local/bin:$PATH"
      mkdir -p "$HOME/.claude"
      herdr integration install claude >/dev/null
      test -x "$HOME/.claude/hooks/herdr-agent-state.sh"
      herdr integration status | grep -qE '^claude: current'
