# The shared base toolchain — the compiler, curl, git, the GitHub CLI, tmux, the Python bits,
# Node, Playwright and beads — that every pack in this directory references by id.
#
# THIS IS A TOOL FILE, NOT A PACK (ADR-0018): `version: 1` plus a `tools:` list and no `pack:`
# block, the same format the admin Tools page exports and imports. It installs nothing on its
# own; it is the one file every other file in here borrows from, and it appears nowhere in the
# pack picker because it is not a pack.
#
# WHY IT IS ITS OWN FILE (issue #499). These definitions used to live in `claude-code.yaml`,
# which was an accident of history — that file began as `ai-coding-agents`, the only pack there
# was, and later packs referenced its tools rather than moving them out. Two costs, one
# dangerous and one merely confusing:
#
#   - Blast radius. A file that fails to parse is skipped at boot. While the base toolchain
#     lived in the Claude Code pack's file, one typo in that pack left every other pack
#     referencing tool ids that no longer existed, and the picker came up empty. Now a typo
#     here does that, and a typo in `claude-code.yaml` costs one pack.
#   - Readers. `curl` and `nodejs` defined under "Claude Code" told every newcomer and every
#     community pack author that the base tools belong to that agent. They never did.
#
# A tool is defined in exactly one file and referenced from anywhere (see
# docs/surge-pack-contract.md); the loader rejects a `toolId` defined twice, so adding a pack
# means listing these ids in your `pack.tools` rather than redefining them.
#
# The four rules apply here as they do anywhere else — idempotent, $ARCH-aware,
# non-interactive, runAs-honest — and these scripts are exercised by every pack's leg of the
# smoke matrix, since every pack installs them.
version: 1

tools:
  # ---------------------------------------------------------------- band 10: apt packages
  # Every apt tool refreshes the package list ONCE via a stamp file. Nothing refreshes it for
  # us: the runtime is only obliged to bootstrap its own JSON parser, and a stock ubuntu:24.04
  # container has no package lists at all. The stamp survives into the CI smoke test's second
  # run, which is what makes that run a genuine no-op.
  - toolId: build-essential
    name: Build Essential
    description: C/C++ compiler and build tools
    category: base
    url: https://packages.ubuntu.com/noble/build-essential
    installOrder: 10
    runAs: root
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      [ -f /var/lib/rockysurf/apt-updated ] || { apt-get update -qq && mkdir -p /var/lib/rockysurf && touch /var/lib/rockysurf/apt-updated; }
      apt-get install -y build-essential
      cc --version >/dev/null

  - toolId: curl
    name: curl
    description: Command-line HTTP client
    category: base
    url: https://curl.se
    installOrder: 10
    runAs: root
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      [ -f /var/lib/rockysurf/apt-updated ] || { apt-get update -qq && mkdir -p /var/lib/rockysurf && touch /var/lib/rockysurf/apt-updated; }
      apt-get install -y curl ca-certificates
      curl --version >/dev/null

  - toolId: gh
    name: GitHub CLI
    description: GitHub's official command-line client
    category: base
    url: https://cli.github.com
    installOrder: 10
    runAs: root
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      [ -f /var/lib/rockysurf/apt-updated ] || { apt-get update -qq && mkdir -p /var/lib/rockysurf && touch /var/lib/rockysurf/apt-updated; }
      # Self-contained rather than ordered after the `curl` tool: this is the only band-10 step
      # that fetches over the network, and `installOrder` ties are broken by toolId, which the
      # contract is explicit is a determinism guarantee and not a dependency mechanism. Both
      # installs are convergent, so the overlap costs nothing.
      apt-get install -y curl ca-certificates

      # GitHub's own apt repository, added the way the Mozilla one in packs/open-claw.yaml is:
      # the keyring is fetched once, and the source list is written only when its content would
      # change — so the `apt-get update` that a new source forces happens on the first run and
      # never again. The smoke harness hashes /etc/apt/sources.list.d across the journal discard,
      # and a source file whose bytes differ between runs fails it.
      #
      # $ARCH is already Debian's spelling, which is also apt's, so it goes straight into the
      # `arch=` qualifier — but branch on it anyway so a third architecture fails loudly here
      # rather than silently writing a source list no mirror serves.
      case "$ARCH" in
        amd64|arm64) gh_arch="$ARCH" ;;
        *) echo "unsupported architecture: $ARCH" >&2; exit 1 ;;
      esac

      install -d -m 0755 /etc/apt/keyrings
      keyring=/etc/apt/keyrings/githubcli-archive-keyring.gpg
      if [ ! -f "$keyring" ]; then
        tmp=$(mktemp)
        curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o "$tmp"
        install -m 0644 "$tmp" "$keyring"
        rm -f "$tmp"
      fi

      list=/etc/apt/sources.list.d/github-cli.list
      want="deb [arch=${gh_arch} signed-by=${keyring}] https://cli.github.com/packages stable main"
      if [ "$(cat "$list" 2>/dev/null)" != "$want" ]; then
        echo "$want" > "$list"
        apt-get update -qq
      fi

      # UNPINNED (deliberate): apt tracks the repository's current stable, and a pinned gh goes
      # stale against the API it talks to. No authentication step follows — gh reads $GITHUB_TOKEN
      # from the environment, which is exactly why server-secrets exports it to the box.
      apt-get install -y gh
      gh --version >/dev/null

  - toolId: git
    name: Git
    description: Distributed version control system
    category: base
    url: https://git-scm.com
    installOrder: 10
    runAs: root
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      [ -f /var/lib/rockysurf/apt-updated ] || { apt-get update -qq && mkdir -p /var/lib/rockysurf && touch /var/lib/rockysurf/apt-updated; }
      apt-get install -y git
      git --version >/dev/null

  - toolId: pipx
    name: pipx
    description: Install and run Python applications in isolated environments
    category: base
    url: https://pipx.pypa.io
    installOrder: 10
    runAs: root
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      [ -f /var/lib/rockysurf/apt-updated ] || { apt-get update -qq && mkdir -p /var/lib/rockysurf && touch /var/lib/rockysurf/apt-updated; }
      apt-get install -y pipx
      pipx --version >/dev/null

  - toolId: python3-pip
    name: pip
    description: Python package installer
    category: base
    url: https://pip.pypa.io
    installOrder: 10
    runAs: root
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      [ -f /var/lib/rockysurf/apt-updated ] || { apt-get update -qq && mkdir -p /var/lib/rockysurf && touch /var/lib/rockysurf/apt-updated; }
      apt-get install -y python3-pip
      python3 -m pip --version >/dev/null

  - toolId: python3-venv
    name: Python venv
    description: Python virtual environment support
    category: base
    url: https://docs.python.org/3/library/venv.html
    installOrder: 10
    runAs: root
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      [ -f /var/lib/rockysurf/apt-updated ] || { apt-get update -qq && mkdir -p /var/lib/rockysurf && touch /var/lib/rockysurf/apt-updated; }
      apt-get install -y python3-venv
      python3 -c 'import venv' >/dev/null

  - toolId: tmux
    name: tmux
    description: Terminal multiplexer for managing sessions
    category: base
    url: https://github.com/tmux/tmux
    installOrder: 10
    runAs: root
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      [ -f /var/lib/rockysurf/apt-updated ] || { apt-get update -qq && mkdir -p /var/lib/rockysurf && touch /var/lib/rockysurf/apt-updated; }
      apt-get install -y tmux
      tmux -V >/dev/null

  - toolId: tmux-mouse
    name: tmux mouse mode
    description: Turns on mouse support in tmux, since a virtual server's terminal never negotiates it on its own
    category: base
    url: https://github.com/tmux/tmux/wiki/FAQ#how-do-i-use-a-mouse-in-tmux
    installOrder: 15
    runAs: rocky
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      # Whole-file write: converges on the same content every run, so a resume or a
      # re-install can never leave a second "set -g mouse on" line behind.
      install -D -m 0644 /dev/stdin "$HOME/.tmux.conf" <<'EOF'
      set -g mouse on
      EOF
      grep -qxF 'set -g mouse on' "$HOME/.tmux.conf"

  - toolId: unzip
    name: unzip
    description: Archive extraction utility
    category: base
    url: https://infozip.sourceforge.net
    installOrder: 10
    runAs: root
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      [ -f /var/lib/rockysurf/apt-updated ] || { apt-get update -qq && mkdir -p /var/lib/rockysurf && touch /var/lib/rockysurf/apt-updated; }
      apt-get install -y unzip
      unzip -v >/dev/null

  # ---------------------------------------------------------------- band 20: runtimes
  - toolId: nodejs
    name: Node.js
    description: JavaScript runtime (v22 LTS)
    category: base
    url: https://nodejs.org
    installOrder: 20
    runAs: root
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      # UNPINNED (deliberate): tracks the latest 22.x patch. Contract-compliant — the
      # NodeSource repository is convergent and apt resolves the right architecture itself —
      # but not reproducible. Pinning a patch release here would strand boxes on stale security
      # fixes; the major version IS pinned, which is the part that breaks tooling.
      [ -f /var/lib/rockysurf/apt-updated ] || { apt-get update -qq && mkdir -p /var/lib/rockysurf && touch /var/lib/rockysurf/apt-updated; }
      if ! command -v node >/dev/null 2>&1; then
        # NodeSource's own apt repository, added by hand instead of piping their setup_22.x
        # script to bash (docs/surge-pack-contract.md "never pipe an unpinned main-branch script
        # to bash") — the same pattern the `gh` tool above uses: fetch the keyring once,
        # write the source list only when its content would change, and only then run
        # apt-get update. This reproduces what setup_22.x itself does (read straight out of
        # that script on 2026-08-21) rather than guessing at NodeSource's layout: dearmor the
        # same signing key into a keyring file, then write a deb822 .sources entry for the
        # node_22.x/nodistro/main repository. The keyring lives under /etc/apt/keyrings, this
        # repo's convention (matching `gh` above) rather than the vendor script's default
        # /usr/share/keyrings — the two paths hold identical content.
        apt-get install -y ca-certificates curl gnupg
        install -d -m 0755 /etc/apt/keyrings
        keyring=/etc/apt/keyrings/nodesource.gpg
        if [ ! -f "$keyring" ]; then
          tmp=$(mktemp)
          curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key -o "$tmp"
          gpg --dearmor -o "$keyring" "$tmp"
          rm -f "$tmp"
        fi

        # $ARCH is already Debian's spelling (see `gh` above); NodeSource's own script
        # branches on architecture too and supports the same two.
        case "$ARCH" in
          amd64|arm64) node_arch="$ARCH" ;;
          *) echo "unsupported architecture: $ARCH" >&2; exit 1 ;;
        esac

        list=/etc/apt/sources.list.d/nodesource.sources
        want=$(printf 'Types: deb\nURIs: https://deb.nodesource.com/node_22.x\nSuites: nodistro\nComponents: main\nArchitectures: %s\nSigned-By: %s\n' "$node_arch" "$keyring")
        if [ "$(cat "$list" 2>/dev/null)" != "$want" ]; then
          printf '%s\n' "$want" > "$list"
          apt-get update -qq
        fi
      fi
      apt-get install -y nodejs
      node --version >/dev/null
      npm --version >/dev/null

  # ---------------------------------------------------------------- band 25/30: runtime-dependent
  # Split from the single legacy `playwright` tool, which declared runAs: rocky and then
  # called `sudo npx playwright install-deps`. The system libraries genuinely need root and
  # the browser download genuinely belongs to the user, so they are two steps with honest
  # runAs values rather than one step that lies and reaches for a sudo the CI container has
  # never had.
  - toolId: playwright-deps
    name: Playwright system libraries
    description: Shared libraries Chromium needs, installed system-wide
    category: base
    url: https://playwright.dev
    installOrder: 25
    runAs: root
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      [ -f /var/lib/rockysurf/apt-updated ] || { apt-get update -qq && mkdir -p /var/lib/rockysurf && touch /var/lib/rockysurf/apt-updated; }
      npx --yes playwright install-deps chromium

  - toolId: playwright
    name: Playwright
    description: Headless browser testing framework
    category: base
    url: https://playwright.dev
    installOrder: 30
    runAs: rocky
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      cd "$HOME"
      # UNPINNED (deliberate): a pinned Playwright drifts out of step with the browser build
      # its API expects. npm install is convergent, so a re-run is a no-op.
      npm install --no-fund --no-audit -D @playwright/test
      npx --yes playwright install chromium
      npx --yes playwright --version >/dev/null

  - toolId: beads
    name: Beads
    description: Git-native task tracking CLI
    category: base
    # The canonical name, for the same reason the download URL below uses it: steveyegge/beads
    # is a rename redirect, and a redirect is a thing that can be turned off.
    url: https://github.com/gastownhall/beads
    installOrder: 30
    runAs: rocky
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      # Both bin directories go on PATH BEFORE anything else, and that is not tidiness.
      # Upstream installs to ~/.local/bin (it used to use ~/.beads/bin), and a box that
      # bootstrapped under an older version has bd in the other one.
      export PATH="$HOME/.local/bin:$HOME/.beads/bin:$PATH"
      #
      # PINNED, and fetched from the release download endpoint rather than through upstream's
      # scripts/install.sh. The reason this step got that treatment is rockysurf-c6cm: it is
      # the one that actually took the trunk down. That installer opens by asking api.github.com
      # for the latest release, an unauthenticated call sharing a 60-per-hour quota keyed on
      # SOURCE IP. A shared CI runner draws an address that other tenants have already spent,
      # the call returns 403, and the installer does not fail on it — it falls through to a Go
      # source build, finds no toolchain, and exits 1. Main run 31802231839 died that way while
      # the same leg had been green on its own pull request minutes earlier: quota roulette on
      # the merge signal, with the asset it wanted sitting on a CDN that has no quota at all.
      #
      # Upstream's installer offers no way to pin — no flag, no environment variable — so the
      # fix has to bypass it. What that installer does beyond fetching, this reproduces: the
      # binary into ~/.local/bin, and the `beads` symlink beside it.
      #
      # To bump: change the version and both digests. The release publishes checksums.txt.
      bd_version=v1.2.1
      case "$ARCH" in
        amd64) bd_sha=48aecf42ffdefa6470298d8022deeb762e30c8729dc0a4bdda93888c0b0354e2 ;;
        arm64) bd_sha=507c35d0fbf382b5ac64824386460a80849d73064d3f50b23eb247eabb68c7a8 ;;
        *) echo "unsupported architecture: $ARCH" >&2; exit 1 ;;
      esac
      # The version is IN the stamp, so bumping it above reinstalls and leaving it alone is a
      # no-op — the run-twice gate measures the second half of that.
      stamp="$HOME/.rockysurf/installed-beads-$bd_version"
      if [ ! -f "$stamp" ]; then
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        # gastownhall is where the repository lives now; steveyegge/beads redirects to it, and a
        # redirect is a thing that can be turned off, so the canonical name is what is written.
        # Bounded retries, per rule 3: one reset mid-download should cost a second, not a box.
        curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
          "https://github.com/gastownhall/beads/releases/download/$bd_version/beads_${bd_version#v}_linux_$ARCH.tar.gz" \
          -o "$tmp/beads.tar.gz"
        echo "$bd_sha  $tmp/beads.tar.gz" | sha256sum -c - >/dev/null
        tar -xzf "$tmp/beads.tar.gz" -C "$tmp"
        install -D -m 0755 "$tmp/bd" "$HOME/.local/bin/bd"
        # Upstream's installer creates this alias, so dropping it would be a silent regression
        # for anyone who types `beads`. -f -n rather than rm-then-link: idempotent on its own.
        ln -sfn bd "$HOME/.local/bin/beads"
        mkdir -p "$(dirname "$stamp")" && touch "$stamp"
      fi
      # Both directories, because which one holds bd depends on when the box was built.
      touch "$HOME/.bashrc"
      for dir in "$HOME/.local/bin" "$HOME/.beads/bin"; do
        grep -qF "$dir" "$HOME/.bashrc" || echo "export PATH=\"$dir:\$PATH\"" >> "$HOME/.bashrc"
      done
      command -v bd >/dev/null 2>&1
