packages:
  - 'packages/*'
# esbuild is a transitive dev dependency of vitest and needs its install script to link the
# platform binary. Nothing in packages/ ships it at runtime.
# better-sqlite3 is a native module — its install script compiles or downloads the binding,
# and core cannot open a database without it.
allowBuilds:
  better-sqlite3: true
  cpu-features: true
  esbuild: true
  ssh2: true
minimumReleaseAgeExclude:
  - '@aws-sdk/client-ec2@3.1108.0'
  - '@aws-sdk/client-ssm@3.1108.0'
  - '@aws-sdk/core@3.977.7'
  - '@aws-sdk/credential-provider-env@3.972.68'
  - '@aws-sdk/credential-provider-http@3.972.70'
  - '@aws-sdk/credential-provider-ini@3.973.13'
  - '@aws-sdk/credential-provider-login@3.972.75'
  - '@aws-sdk/credential-provider-node@3.972.79'
  - '@aws-sdk/credential-provider-process@3.972.68'
  - '@aws-sdk/credential-provider-sso@3.973.12'
  - '@aws-sdk/credential-provider-web-identity@3.972.74'
  - '@aws-sdk/middleware-sdk-ec2@3.972.56'
  - '@aws-sdk/nested-clients@3.997.42'
  - '@aws-sdk/signature-v4-multi-region@3.996.44'
  - '@aws-sdk/token-providers@3.1108.0'
  - '@aws-sdk/types@3.974.3'
  - '@aws-sdk/xml-builder@3.972.38'

# `spike/` is deliberately NOT a member. rockysurf-oaw1 deleted the de-risking spike's
# sources (rockysurf-d0no) along with its separate workspace root and lockfile; only
# `spike/recordings/` survives, and transcripts are not a package.
