# Cline — the open-source coding agent, in the terminal, on the shared base toolchain.
#
# Cline began as a VS Code extension; the `cline` npm package is its CLI, which runs on a
# headless box with no editor and no desktop. That is the half this pack installs.
#
# The base tool ids below are DEFINED in packs/ai-coding-agents.yaml and referenced here.
# Only `cline` is defined in this file.
version: 1

pack:
  packId: cline
  name: Cline
  tools:
    - build-essential
    - curl
    - gh
    - git
    - tmux
    - tmux-mouse
    - unzip
    - python3-pip
    - python3-venv
    - pipx
    - nodejs
    - playwright-deps
    - playwright
    - beads
    - agent-deck
    - beads-viewer
    - cline
  displayOrder: 11
  enabled: true
  # No `imageUrl`: this repository ships no Cline card art, and the UI draws a monogram tile
  # for a pack without one. Add the PNG to BOTH packages/core/public/images/surge-packs/ and
  # packages/web/public/images/surge-packs/ before naming it here.
  #
  # The agent reads and edits a checkout, so a box with no repository is a box where it has
  # nothing to work on.
  requiresRepos: true
  requiresRdp: false
  guide: |
    Everything below runs on the box, as `rocky`, after you have SSH'd in.

    Cline
      cline auth              interactive setup: pick a provider, paste its key
      cline                   starts the terminal UI in the directory you are standing in
      cline "fix the flaky test in api.test.ts"
                              one task, then back to your shell

      Sign in first. `cline auth` walks you through it, and there is a non-interactive
      spelling for scripts:

        cline auth --provider anthropic --modelid <model-id>
          the key goes on the same command line as --apikey, which anything else on the
          box can read out of `ps`. Prefer the environment variable below.

      Cline also reads a provider key straight from the environment, which is the safer
      path on a shared box:

        echo 'export ANTHROPIC_API_KEY=...' >> ~/.bashrc && . ~/.bashrc
          or OPENAI_API_KEY, or GEMINI_API_KEY — whichever provider you pay for.

        Rocky Surf can deliver that for you: put it on a `secret:` line of the create
        form's Environment field and it is in your shell here from the first login, with
        nothing to export. On a box created without it, the export above is the way.

      cline --version         proves the install; it is what this pack's setup checked
      cline --help            the full flag list

      Running it unattended:
        cline --yolo "..."    approves its own tool calls — on a box holding your
                              repositories, be sure that is what you typed
        cline --json "..."    NDJSON on stdout, for piping into something else
        cline --zen "..."     hands the task to the background hub and returns

      Settings and history live in ~/.cline/data on this box. Nothing there is backed up.

    GitHub
      gh auth login           then: gh auth setup-git

      Your shell has no $GITHUB_TOKEN. If the operator set `github.pat` in
      rockysurf.config.yaml, that token was handed to the bootstrap and your repositories
      were cloned with it — but it is not exported into an interactive session, so `gh`
      and your own pushes need this login.

    Also installed
      bd            Beads task tracker — run `bd init` in a repository to start
      tmux          run agents in here; a dropped SSH connection then costs you nothing
      Playwright with Chromium, for browser work

tools:
  - toolId: cline
    name: Cline
    description: Open-source terminal coding agent that runs on Anthropic, OpenAI, Google or a local model
    category: agent
    url: https://cline.bot
    installOrder: 40
    # A global npm install writes into /usr/lib/node_modules, which is root's — the same
    # privilege the other npm-installed agents in this repository take.
    runAs: root
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      # UNPINNED (deliberate): an agent CLI pinned to a stale version is worse for the user
      # than one that tracks its own releases. npm install -g is convergent.
      #
      # No $ARCH branch is needed: `cline` is a launcher whose per-platform binaries ship as
      # optional dependencies (@cline/cli-linux-x64 / @cline/cli-linux-arm64) and npm picks
      # the right one. The version check below is what proves it picked an executable build.
      npm install -g --no-fund --no-audit cline
      cline --version >/dev/null
