# Gas Town — multi-agent workspace manager, with all three agent CLIs alongside it.
#
# The base tool ids below are DEFINED in packs/ai-coding-agents.yaml; `amp` and `codex` come
# from packs/amp-agents.yaml and packs/codex-cli.yaml.
version: 1

pack:
  packId: gas-town
  name: Gas Town
  tools:
    - build-essential
    - curl
    - gh
    - git
    - tmux
    - tmux-mouse
    - unzip
    - python3-pip
    - python3-venv
    - pipx
    - nodejs
    - playwright-deps
    - playwright
    - beads
    - beads-viewer
    - dolt
    - claude-code
    - amp
    - codex
    - gas-town
  displayOrder: 4
  enabled: true
  imageUrl: /images/surge-packs/gas-town.png
  requiresRepos: true
  requiresRdp: false
  guide: |
    Everything below runs on the box, as `rocky`, after you have SSH'd in.

    Authenticate the agents first — Gas Town drives them, and it cannot do this for you
      claude setup-token      or just `claude`, which walks you through signing in
      codex login             signs in with a ChatGPT plan
      amp                     first run prints a sign-in URL for ampcode.com

    Your workspace already exists
      cd ~/gt                 `gt install` ran during setup
      gt status               one rig and crew per repository you selected
      gt --help

      Dolt is installed and already has a commit identity (rocky@localhost); change it with
      `dolt config --global` if you want your own name on the HQ's history.

      gt is the upstream v1.1.0 release binary, in ~/.local/bin. Later releases cannot yet
      build a Beads-backed HQ on a fresh box, so a newer gt would give you a workspace that
      fails to initialise. Nothing on this box compiles it, and there is no Go toolchain
      here — if you want one, `sudo apt-get install -y golang-go`.

    GitHub
      gh auth login           then: gh auth setup-git

      If the operator set `github.pat` in rockysurf.config.yaml, that token is in your
      shell as $GITHUB_TOKEN — the same one that cloned your repositories — so `gh` works
      as it is; run `gh auth setup-git` once and your own pushes do too. With no token
      configured, `gh auth login` is the way in.

tools:
  # There is no `gas-town-toolchain` here any more. This pack used to install Ubuntu's Go
  # compiler so it could build `gt` from source; it now downloads upstream's release binary,
  # and nothing else on the box needs Go — `bd` comes from a beads release asset too (see
  # `beads` in packs/ai-coding-agents.yaml), and `libicu-dev`, which the source build of gt
  # v1.2.0 wanted, was never installed here at all. Removing the compiler takes ~500 MB of
  # apt and every request to the Go module proxy off the critical path of a fresh box: that
  # proxy was the only thing in any shipped pack that could not be retried, and it failed
  # three smoke runs in one day (#200). A pack that wants Go again should define its own
  # toolchain tool rather than reviving this id.

  # `gt install` refuses to create an HQ without dolt on PATH, and every `gt rig add` needs the
  # Dolt server that `gt` starts. Nothing else in packs/ installs it, and beads' own CLI does
  # not need it (bd embeds Dolt as a library), so it belongs here rather than next to `beads`.
  - toolId: dolt
    name: Dolt
    description: Versioned SQL database, the store behind Gas Town's Beads-backed HQ
    category: base
    url: https://github.com/dolthub/dolt
    installOrder: 36
    runAs: root
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      # PINNED, and arch-branched: dolt is not in apt, it ships as a per-architecture GitHub
      # release tarball. Upstream's own installer is `curl … | sudo bash`, which rule 4 rules
      # out; this is the same download without the sudo.
      DOLT_VERSION=2.2.3
      case "$ARCH" in
        amd64) dolt_arch=amd64 ;;
        arm64) dolt_arch=arm64 ;;
        *) echo "unsupported architecture: $ARCH" >&2; exit 1 ;;
      esac
      # Guarded on the installed version rather than on a stamp, so a re-run neither
      # re-downloads nor rewrites the binary, while bumping DOLT_VERSION still reinstalls.
      if [ "$(dolt version 2>/dev/null | awk 'NR==1{print $3}')" != "$DOLT_VERSION" ]; then
        tmp=$(mktemp)
        curl -fsSL "https://github.com/dolthub/dolt/releases/download/v${DOLT_VERSION}/dolt-linux-${dolt_arch}.tar.gz" \
          | tar -xzO "dolt-linux-${dolt_arch}/bin/dolt" > "$tmp"
        install -m 0755 "$tmp" /usr/local/bin/dolt
        rm -f "$tmp"
      fi
      dolt version >/dev/null

  - toolId: gas-town
    name: Gas Town
    description: Multi-agent workspace manager
    category: agent
    url: https://github.com/gastownhall/gastown
    installOrder: 40
    runAs: rocky
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      export PATH="$HOME/.local/bin:$PATH"
      # PREBUILT, not compiled. This step used to be `go install …/cmd/gt@v1.1.0` behind an apt
      # Go toolchain, and it was the only step in any shipped pack that fetched from the Go
      # module proxy. That proxy is not retriable from here — `go install` resolves dozens of
      # modules per fresh box and gives up on the first stream reset — and it broke three Pack
      # smoke runs in one day, always on the same leg, always green on rerun (#200). Upstream
      # ships goreleaser binaries for exactly the two architectures this project supports, so
      # the fix is to stop compiling: same idiom as `beads` and `beads-viewer`, a CDN download
      # with bounded retries and a digest.
      #
      # Chosen over `npm i -g @gastown/gt`, which upstream also documents: that package's
      # newest version is 0.12.0 (published 2026-03-12, checked 2026-08-27) and it is a wrapper
      # whose postinstall goes and fetches the native binary anyway — a stale indirection over
      # the download this does directly.
      #
      # PINNED, under docs/writing-a-pack.md § Which version to install: case 2 (a GitHub
      # release asset has no quota-free "latest") AND the narrow agent exception — v1.2.1's
      # `gt install --git` still cannot build the Beads-backed HQ this pack exists to hand the
      # user. Retested on a fresh arm64 container on 2026-08-27 with the prebuilt v1.2.1 binary:
      # HQ creation dies inside `bd init` with "pending schema migrations alter pre-existing
      # dirty tables: config, interactions, routes" (gastownhall/beads#4566, fixed for embedded
      # mode only — `gt` uses server mode), with both bd v1.2.1 and bd v1.2.2. So the pin stays
      # where it was; only the way the binary arrives has changed. Issue #133 tracks lifting it.
      #
      # To bump: change the version and both digests, which the release publishes as
      # gastown_<version>_checksums.txt beside the assets.
      gt_version=v1.1.0
      case "$ARCH" in
        amd64) gt_sha=f3e75d9d4d5f5d93e2cc9a7a7312d5d6ad05e748783c1af7b0474d9a1e86c8fe ;;
        arm64) gt_sha=8e08c4778da3b0387e82dc6195f10f1034a6eb66b036cfc2853f838a48cc277a ;;
        *) echo "unsupported architecture: $ARCH" >&2; exit 1 ;;
      esac
      # The version is IN the stamp, so bumping it above reinstalls and leaving it alone is a
      # no-op — which is what the run-twice gate measures.
      stamp="$HOME/.rockysurf/installed-gas-town-$gt_version"
      if [ ! -f "$stamp" ]; then
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        # gastownhall is where the repository lives now; steveyegge/gastown redirects to it, and
        # a redirect is a thing that can be turned off, so the canonical name is what is written.
        # (The Go module path is still github.com/steveyegge/gastown; nothing here reads it.)
        curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
          "https://github.com/gastownhall/gastown/releases/download/$gt_version/gastown_${gt_version#v}_linux_$ARCH.tar.gz" \
          -o "$tmp/gastown.tar.gz"
        echo "$gt_sha  $tmp/gastown.tar.gz" | sha256sum -c - >/dev/null
        tar -xzf "$tmp/gastown.tar.gz" -C "$tmp"
        install -D -m 0755 "$tmp/gt" "$HOME/.local/bin/gt"
        mkdir -p "$(dirname "$stamp")" && touch "$stamp"
      fi
      # `beads` writes the same guarded line, and this is deliberately the same string so that
      # whichever of the two runs first, the other finds it and the second run appends nothing.
      # Self-contained per rule: installOrder is ordering, not a dependency, so this step puts
      # its own bin directory on PATH rather than assuming `beads` already did.
      touch "$HOME/.bashrc"
      grep -qF "$HOME/.local/bin" "$HOME/.bashrc" || echo "export PATH=\"$HOME/.local/bin:\$PATH\"" >> "$HOME/.bashrc"
      gt --version >/dev/null
    setupScript: |
      set -euo pipefail
      # gt and bd both live in ~/.local/bin now; ~/.beads/bin is where an older box's bd is.
      export PATH="$HOME/.local/bin:$HOME/.beads/bin:$PATH"

      # The HQ's task database is Dolt, and Dolt will not open a store for a user with no commit
      # identity — `gt install` stops with "dolt identity not configured and git user.name not
      # available" before it creates anything. A box has no identity to inherit, so give it the
      # one it does have. Guarded per key: `--add` on a key that already holds a value appends a
      # second one rather than replacing it.
      dolt config --global --list | grep -q '^user\.name ' || dolt config --global --add user.name rocky
      dolt config --global --list | grep -q '^user\.email ' || dolt config --global --add user.email rocky@localhost

      # `gt install` initialises the workspace once; re-running it on an existing checkout is
      # not something we can assume is safe, so it is guarded on the marker it creates.
      [ -d "$HOME/gt/.git" ] || gt install "$HOME/gt" --git
      cd "$HOME/gt"

      # One rig + crew per repository the user selected. `gt rig add` on an existing rig is
      # an error rather than a no-op, so each is stamped: this is the generic guard for a
      # third-party command with no idempotent mode. A rig add that fails removes its own
      # directory (gastown's AddRig cleans up on error), so a re-run after a failure is a
      # plain retry, not a "directory already exists".
      #
      # `gt rig add` clones the repository AGAIN, bare, from the URL — it does not use the
      # checkout in $HOME the bootstrap already made. For a private repository that git is
      # authenticated by the credential helper the bootstrap hands every setup step through
      # GIT_CONFIG_* (issue #142); nothing here may add credentials of its own.
      for repo in $(echo "${REPOS:-}" | tr ',' ' '); do
        [ -n "$repo" ] || continue
        repo_name=$(basename "$repo" .git)
        clean_name=$(echo "$repo_name" | tr '-' '_' | tr -cd '[:alnum:]_')
        [ -n "$clean_name" ] || continue
        stamp="$HOME/.rockysurf/gt-rig-$clean_name"
        if [ ! -f "$stamp" ]; then
          gt rig add "$clean_name" "$repo"
          gt crew add "${clean_name}_crew" --rig "$clean_name"
          mkdir -p "$(dirname "$stamp")" && touch "$stamp"
        fi
      done
