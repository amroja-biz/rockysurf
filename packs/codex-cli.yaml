# Codex CLI — OpenAI's coding agent, on the shared base toolchain.
#
# The base tool ids below are DEFINED in packs/base.yaml and referenced here.
# Only `codex` and `herdr-codex-integration` are defined in this file; packs/gas-town.yaml
# references both.
version: 1

pack:
  packId: codex-cli
  name: Codex CLI
  tools:
    - build-essential
    - curl
    - gh
    - git
    - tmux
    - tmux-mouse
    - unzip
    - python3-pip
    - python3-venv
    - pipx
    - nodejs
    - playwright-deps
    - playwright
    - beads
    - herdr
    - codex
    - herdr-codex-integration
  displayOrder: 3
  enabled: true
  imageUrl: /images/surge-packs/codex-cli.png
  requiresRepos: true
  requiresRdp: false
  guide: |
    Everything below runs on the box, as `rocky`, after you have SSH'd in.

    Codex
      codex login             signs in with a ChatGPT plan; prints a URL to open
      API billing instead? Put your key in the shell and keep it:
        echo 'export OPENAI_API_KEY=...' >> ~/.bashrc && . ~/.bashrc
      then: codex

    GitHub
      gh auth login           then: gh auth setup-git

      If the operator set `github.pat` in rockysurf.config.yaml, that token is in your
      shell as $GITHUB_TOKEN — the same one that cloned your repositories — so `gh` works
      as it is; run `gh auth setup-git` once and your own pushes do too. With no token
      configured, `gh auth login` is the way in.

    Also installed
      bd            Beads task tracker — run `bd init` in a repository to start
      tmux          run agents in here; a dropped SSH connection then costs you nothing
      Playwright with Chromium, for browser work

    Herdr
      herdr                   opens the workspace; start agents inside it and a dropped SSH
                              connection costs you nothing — `herdr` again reattaches
      herdr --help            the rest of what it does

      On your own machine, one line attaches this box to your local herdr, so its agents
      show up beside the ones running there:

        herdr machine add rocky@<ip>

      herdr has no `-i` flag: it connects with whatever plain `ssh rocky@<ip>` would use.
      If that bare command does not get you in on its own, herdr will not either — give ssh
      the key first, either with a block in ~/.ssh/config

        Match user rocky
          IdentityFile ~/.ssh/<your-key>

      or by loading it into your agent with `ssh-add ~/.ssh/<your-key>`.

      Installed at ~/.local/bin/herdr, pinned to 0.9.0.
      The Codex integration is already installed — `herdr integration status` says
      `codex: current` — so Codex reports working, blocked or idle from its very first run.

tools:
  - toolId: codex
    name: Codex
    description: OpenAI's CLI coding agent
    category: agent
    url: https://github.com/openai/codex
    installOrder: 40
    runAs: root
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      # UNPINNED (deliberate): tracks its own releases, as an agent CLI should.
      npm install -g --no-fund --no-audit @openai/codex
      codex --version >/dev/null

  # Herdr's Codex integration: `herdr integration install codex` writes
  # $HOME/.codex/herdr-agent-state.sh, hooks.json, and ensures config.toml — merging into an
  # existing config.toml rather than replacing it. It refuses to run until $HOME/.codex exists,
  # and Codex only creates that directory on its first interactive run — which never happens
  # during a bootstrap — so the directory is created here first. Verified 2026-09-11 that the
  # install is idempotent (a second run leaves the written files byte-identical) and that it
  # merges into config.toml rather than replacing it. Band 50: needs `herdr` (30) on disk and is
  # meaningful only once `codex` (40) is installed. `packs/gas-town.yaml` carries Codex too and
  # references this id.
  - toolId: herdr-codex-integration
    name: Herdr Codex integration
    description: Installs herdr's state hook into $HOME/.codex so Codex CLI reports its state to herdr
    category: base
    url: https://herdr.dev
    installOrder: 50
    runAs: rocky
    bootstrap: false
    enabled: true
    installScript: |
      set -euo pipefail
      export PATH="$HOME/.local/bin:$PATH"
      mkdir -p "$HOME/.codex"
      herdr integration install codex >/dev/null
      herdr integration status | grep -qE '^codex: current'
